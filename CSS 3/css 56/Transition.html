<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
</head>
<style>
    #box {
        width: 150px;
        height: 150px;
        background: pink;
        /* transition-property: all;
        transition-duration: 2s ;
        transition-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transition-delay: 1s; */

        transition: all 2s cubic-bezier(0.075, 0.82, 0.165, 1) 1ms;
    }

    #box:active {
        width: 300px;
        height: 300px;
        background: orange;
    }
</style>

<body>
    <h1>Transition</h1>
    <div id="box"></div>
</body>

</html>
