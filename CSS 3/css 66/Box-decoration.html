<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-decoration</title>
</head>
<style>
    span {
        background-image: linear-gradient(red, yellow);
        font-size: 21px;
        line-height: 50px;
        border: 2px solid black;
        border-radius: 5px;
        box-decoration-break: clone;
        padding: 10px;
    }
</style>

<body>
    <h1>Box-decoration</h1>

    <span>Lorem ipsum dolor, <br>sit amet consectetur adipisicing <br> elit. Aut sunt beatae <br>harum ex dolore velit
        ipsaesse praesentium.</span>
</body>

</html>
