<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List-Style</title>
    <style>
        ul {
            list-style-type: circle;
            list-style-position: inside;
            list-style-image: url(download.jpeg);
            border: 1px solid red;

            list-style: circle inside url(download.jpeg);

        }
         ol {
            list-style-type: lower-roman;
            list-style-position: inside;
            border: 1px solid red;
        }
    </style>
</head>

<body>
    <h1>Mayur Piprewar : List-Style</h1>

    <ul>
        <li>Orange</li>
        <li>Banana</li>
        <li>Mango</li>
        <li>Apple</li>
        <li>Gauva</li>
    </ul>

    <ol>
        <li>Orange</li>
        <li>Banana</li>
        <li>Mango</li>
        <li>Apple</li>
        <li>Gauva</li>
    </ol>
</body>

</html>
