<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counters</title>
</head>
<style>
    body {
        counter-reset: heading ;
    }

    h3::before {
        counter-increment: heading;
        content: "0 : ";
        counter(heading) " : ";
        
    }
</style>

<body>
    <h1>Counters</h1>
    <h3>Introduction</h3>
    <h3>Methodology</h3>
    <h3>Result and Disscusion</h3>
    <h3>Conclusion</h3>
</body>

</html>
