    <title>Dispay</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        li {
            border: 1px solid red;
            display: inline;
        }

        ul {
            border: 2px solid black;
        }

        span {
            border: 2px solid green;
            display: list-item;
            width: 500px;
            padding: 10px;
            margin: 20px;
            list-style-position: inside;
        }

        a {
            border: 2px solid blue;
            width: 200px;
            margin: 20px;
            display: block;
            padding: 10px;
            display: inline-block;
        }
    </style>
</head>
