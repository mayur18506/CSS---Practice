<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation-Fill-Mode</title>
</head>
<style>
    .box {
        width: 150px;
        height: 150px;
        background: black;
        margin-left: 20px;
        animation: sample 2s 1s;
        animation-fill-mode: both;
    }

    .box:hover {
        animation-play-state: paused;
        /* running */
    }

    @keyframes sample {

        0% {
            background: yellow;
            width: 250px;
        }

        50% {
            background: green;
            width: 350px;
        }

        100% {
            background: red;
            width: 450px;
        }
    }
</style>

<body>
    <h1>Animation-Fill-Mode</h1>

    <div class="box"></div>
</body>

</html>
