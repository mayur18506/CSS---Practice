<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-Shadow</title>
    <style>
        #box {
            width: 250px;
            height: 250px;
            margin: 50px 0 0 100px;
            padding: 10px;
            border: 2px solid black;
            background-color: pink;
            box-shadow: 6px 6px 20px 2px rgb(236, 58, 58), 1px 1px 20px blue inset;
        }
    </style>
</head>

<body>
    <h1>Mayur Piprewar : Box-Shadow</h1>
    <div id="box">
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Laboriosam sapiente in quod aliquam obcaecati illo aut
        dolorem quidem nesciunt ad, odio repellat tenetur dolorum nulla, quae quos sit temporibus maxime.
    </div>
</body>

</html>
