<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
</head>
<style>
    .card {
        width: 300px;
        height: 300px;
        position: absolute;
        left: 50%;
        top: 50%;
        line-height: 30px;
        background-color: white;
        margin: -150px;
        color: #03446A;
        text-align: center;
        font-size: 40px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0, 1);
        animation-name: sample;
        animation-duration: 2s;
        animation-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        animation-delay: 0s;
        animation-iteration-count: infinite;
        animation-direction: alternate;


        /* animation: sample 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2ms infinite alternate; */
    }

    @keyframes sample {
        0% {
            border-radius: 0%;

        }

        25% {
            background-color: green;
        }

        50% {
            background-color: yellow;
        }

        100% {
            border-radius: 50%;
            background-color: tomato;
            color: white;
        }
    }
</style>

<body>
    <h1>Animation</h1>
    <div class="card"></div>
</body>

</html>
