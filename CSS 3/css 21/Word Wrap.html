<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Wrap</title>
    <style>
        #box {
            width: 400px;
            border: 2px solid black;
            word-wrap: break-word;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <h1>Mayur Piprewar : Word Wrap</h1>

    <div id="box">
        Lorem ipsum dolor sveryyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyuuuuuuuuuuuuuuuu it amet consectetur
        adipisicing elit. Voluptatibus eaque mollitia odio perferendis corrupti minus ab est laboriosam vel quam!
    </div>
</body>

</html>
