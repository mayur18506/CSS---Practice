<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text properties</title>
    <style>
        #box {
            width: 400px;
            padding: 25px;
            border: 2px solid red;
            font-family: Arial, Helvetica, sans-serif;
            text-align: justify;
            text-align-last: right;
            text-transform: capitalize;
            text-indent: 15px;
            word-spacing: 15px;
            letter-spacing: 3px;
        }
    </style>
</head>

<body>
    <h1>Mayur Piprewar : Text properties</h1>

    <div id="box">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Maxime atque unde provident ea id aspernatur voluptate
        quasi beatae dolorem itaque? Lorem ipsum dolor sit amet consectetur adipisicing elit. Iusto, mayur piprewar
        numquam.
    </div>
</body>

</html>
