<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Visibility</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        ul {
            visibility: hidden;
        }

        tr.first {
            visibility: collapse;
        }

        tr.second {
            visibility: collapse;
        }
    </style>
</head>

<body>
    <h1>Mayur Piprewar :Visibility</h1>
    <ul>List Item 1</ul>
    <ul>List Item 2</ul>
    <ul>List Item 3</ul>
    <ul>List Item 4</ul>

        architecto mollitia quasi rerum sint enim?
    </p>
    <table border="1">
        <tr>

            <td>Piprewar</td>
            <td>mayur</td>
        </tr>
        <tr class="first">

            <td>mayur</td>
            <td>Piprewar</td>
        </tr>
        <tr class="second">

            <td>Piprewar</td>
            <td>mayur</td>
        </tr>
    </table>
</body>

</html>
